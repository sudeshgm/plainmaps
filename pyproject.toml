[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plainmaps"
version = "0.1.0"
description = "MIT lookup tables for commonly known codes. Unknown codes return None."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "sudeshgm"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
plainmaps = ["py.typed", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
